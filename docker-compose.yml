version: '3.8'

services:
  # Distributed Cache for Atomic Idempotency Claims (SETNX with 24h TTL)
  redis:
    image: redis:7-alpine
    container_name: upi-mesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Web UI to inspect Redis keys and TTLs during demo/interviews
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: upi-mesh-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  redis_data:
